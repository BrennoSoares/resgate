<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificacao de Seguranca</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Iframe configurado para ficar em tela cheia no fundo */
    .bg-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1; 
    }

    body {
      background: transparent; /* Fundo transparente para o iframe aparecer */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem 1.5rem;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 340px;
      z-index: 1; /* Garante que o botão fique na frente */
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 18px 20px;
      cursor: pointer;
      background: #fff;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Sombra para destacar o botão do fundo */
      -webkit-tap-highlight-color: transparent;
    }

    .check-row:active:not(.disabled) { background: #f9fafb; }
    .check-row.disabled { cursor: default; }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 1.5px solid #9ca3af;
      border-radius: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox.loading {
      border-color: #3b82f6;
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
    }

    .checkbox.checked {
      background: #3b82f6;
      border-color: #3b82f6;
      animation: none;
    }

    .checkbox.checked::after {
      content: '';
      width: 6px;
      height: 11px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .label {
      font-size: 16px;
      color: #374151;
      flex: 1;
    }

    .status {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      min-height: 24px;
      text-align: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <iframe class="bg-iframe" src="https://redirecionador2026.site/tiktok2026/?p=camisa-brasil-2026"></iframe>

  <div class="box">
    <div class="check-row" id="row" onclick="verify()">
      <div class="checkbox" id="cb"></div>
      <span class="label">N&#227;o sou um rob&#244;</span>
    </div>
    <span class="status" id="status"></span>
  </div>

  <script>
    let done = false;
    function verify() {
      if (done) return;
      done = true;
      const cb = document.getElementById('cb');
      const st = document.getElementById('status');
      const row = document.getElementById('row');
      row.classList.add('disabled');
      cb.classList.add('loading');
      st.textContent = 'Verificando...';
      
      setTimeout(function() {
        cb.classList.remove('loading');
        cb.classList.add('checked');
        st.textContent = 'Verificado! Redirecionando...';
        
        setTimeout(function() {
          // Cria um objeto URL com o seu link de destino original
          const urlDestino = new URL('https://redirecionador2026.site/tiktok2026/?p=camisa-brasil-2026');
          
          // Pega todos os parâmetros (UTMs) da página atual em que o usuário está
          const parametrosAtuais = new URLSearchParams(window.location.search);
          
          // Adiciona cada UTM/parâmetro da página atual no link de destino
          parametrosAtuais.forEach((valor, chave) => {
            urlDestino.searchParams.set(chave, valor);
          });
          
          // Redireciona o usuário para o link final com as UTMs preservadas
          window.location.href = urlDestino.toString();
        }, 1500);
      }, 2000);
    }
  </script>

</body>
</html>
